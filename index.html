<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #fff5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 75, 110, 0.15);
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
        }
        .media-box {
            width: 100%;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        .media-box img, .media-box svg {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }
        h2 {
            color: #4a4a4a;
            font-size: 22px;
            margin-bottom: 25px;
            line-height: 1.4;
            min-height: 60px;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 60px;
            align-items: center;
        }
        button {
            padding: 12px 35px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }
        #yesBtn {
            background-color: #ff4b6e;
            color: white;
        }
        #noBtn {
            background-color: #e0e0e0;
            color: #666;
            transition: all 0.1s ease;
            position: relative;
            z-index: 999;
        }
    </style>
</head>
<body>

    <!-- Tu Chahiye - Atif Aslam (Direct Stream Link) -->
    <audio id="bgMusic" loop>
        <source src="https://r2.dev" type="audio/mpeg">
    </audio>

    <div class="container">
        <div class="media-box" id="mediaBox">
            <!-- Ghibli Style Proposal Art (SVG Vector) -->
            <svg viewBox="0 0 100 100" width="150" height="150">
                <circle cx="50" cy="45" r="15" fill="#ffd1dc"/>
                <path d="M40 70 C 40 55, 60 55, 60 70 Z" fill="#4a69bd"/>
                <circle cx="65" cy="50" r="12" fill="#ffe0bd"/>
                <path d="M55 75 C 55 62, 75 62, 75 75 Z" fill="#ff6b81"/>
                <path d="M38 70 L48 65 L44 60 Z" fill="#4a69bd"/>
                <path d="M12,50 A15,15 0 0,1 42,50 A15,15 0 0,1 72,50 Q72,75 42,95 Q12,75 12,50 Z" fill="#ff4757" opacity="0.3"/>
            </svg>
        </div>
        
        <h2 id="questionText">Do you love me?</h2>
        
        <div class="btn-container" id="buttonArea">
            <button id="yesBtn" onclick="handleYes()">Yes</button>
            <button id="noBtn" onclick="handleClickNo()">No</button>
        </div>
    </div>

    <script>
        let attempt = 1;
        const noBtn = document.getElementById('noBtn');
        const questionText = document.getElementById('questionText');
        const mediaBox = document.getElementById('mediaBox');
        const bgMusic = document.getElementById('bgMusic');
        const container = document.querySelector('.container');

        // Target elusive actions for the 4th step onwards
        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            moveNoButton();
        });

        function handleClickNo() {
            if (attempt === 1) {
                // Attempt 2: Cute Crying Cat GIF + Dynamic Question Text
                mediaBox.innerHTML = `<img src="https://giphy.com" alt="Crying Cat">`;
                questionText.innerText = "Please, do you love me? Sach bolo na. Please. 🥺";
                
                // Play Atif Aslam - Tu Chahiye immediately on 2nd screen
                bgMusic.play().catch(err => console.log("Audio waiting for interaction fallback."));
                attempt = 2;
            } 
            else if (attempt === 2) {
                // Attempt 3: Final warning phrase before evasive actions activate
                questionText.innerText = "Soch lo, last baar please did you love me? 🎵";
                attempt = 3;
            }
        }

        function moveNoButton() {
            // Activating running button mechanics from the 4th step onwards
            if (attempt >= 3) {
                const containerRect = container.getBoundingClientRect();
                const btnRect = noBtn.getBoundingClientRect();

                const maxX = containerRect.width - btnRect.width - 40;
                const maxY = containerRect.height - btnRect.height - 40;

                const randomX = Math.floor(Math.random() * maxX) - (maxX / 2);
                const randomY = Math.floor(Math.random() * maxY) - (maxY / 2);

                noBtn.style.position = 'absolute';
                noBtn.style.left = `calc(50% + ${randomX}px - ${btnRect.width/2}px)`;
                noBtn.style.top = `calc(50% + ${randomY}px - ${btnRect.height/2}px)`;
            }
        }

        function handleYes() {
            // Final Step Screen layout rendering
            document.getElementById('buttonArea').innerHTML = '';
            mediaBox.innerHTML = `
                <svg viewBox="0 0 100 100" width="120" height="120">
                    <path d="M50 80 C50 80 20 50 20 35 C20 20 35 15 50 30 C65 15 80 20 80 35 C80 50 50 80 50 80 Z" fill="#ff4b6e"/>
                    <path d="M50 75 L50 95" stroke="#2ed573" stroke-width="4" stroke-linecap="round"/>
                    <path d="M50 85 Q35 80 30 85" fill="none" stroke="#2ed573" stroke-width="3" stroke-linecap="round"/>
                </svg>
            `;
            questionText.innerHTML = "I was knowing that you love me. 🌹✨";
            
            // Re-confirm audio safety stream playback
            bgMusic.play().catch(() => {});
        }
    </script>
</body>
</html>
